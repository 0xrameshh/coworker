[workspace]
resolver = "2"
members = [
    "crates/coworker-core",
    "crates/coworker-server",
    "crates/coworker-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/vikramships/coworker"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.43", features = ["full"] }

# Web server
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# File operations
walkdir = "2.5"
globset = "0.4"
grep = "0.3"
ignore = "0.4"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Utils
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.11"
